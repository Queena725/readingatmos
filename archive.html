<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reading Atmos Archive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="archive-body">
    <main class="page archive-page">
      <section class="archive-wall" id="archiveWall" aria-label="Atmos article index">
        <div class="archive-toolbar">
          <div class="wall-center" aria-hidden="true">
            <img
              id="wallLogo"
              src="data:image/svg+xml,%3Csvg%20viewBox%3D'-42%20-42%20402%20387'%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%3E%3Cpath%20d%3D'M258.737%20243.684C248.931%20166.791%20229.591.501%20172.983.5%20116.374.499%2096.231%20141.984%2074.659%20237.941%2053.086%20333.898-30.091%20308.403%2029.281%20231.917%2088.653%20155.432%20258.737%20160.696%20303.844%20237.941%20348.951%20315.186%20268.543%20320.578%20258.737%20243.684Z'%20fill%3D'none'%20stroke%3D'black'%20stroke-width%3D'4'%2F%3E%3Cpath%20d%3D'M103.805%20106.472C181.432-57.303%20237.164%20110.325%20237.164%20110.325S218%203%20173.746.5C129.558-1.996%20108.095%2088.404%20103.824%20106.39Z'%20fill%3D'black'%2F%3E%3Cpath%20d%3D'M260%20248.5C273.5%20334.5%20350.5%20309.5%20302%20236c35.301%2058.835-26%2068.5-42%2012.5Z'%20fill%3D'black'%2F%3E%3Cpath%20d%3D'M68.775%20256.196C41.319%20332.681-33.477%20300.558%2037.125%20224.073-6.021%20275.063%2043.28%20309.147%2068.775%20256.196Z'%20fill%3D'black'%2F%3E%3C%2Fsvg%3E"
              alt=""
            />
          </div>
          <div class="archive-intro">
            <p>
              A new way to read Atmos.<br />
              Move through articles, moods, and visual signals as the logo
              changes with what you explore.
            </p>
          </div>
          <div class="archive-actions">
            <label class="archive-search" aria-label="Search archive">
              <span>search</span>
              <input
                id="articleSearch"
                type="search"
                autocomplete="off"
                placeholder="Search"
              />
            </label>
            <a
              class="archive-magazine"
              href="https://atmos.earth/"
              target="_blank"
              rel="noopener noreferrer"
            >
              atmos.earth
            </a>
            <a class="archive-link" href="archive.html" aria-current="page">archive</a>
          </div>
        </div>

        <div class="wall-stage">
          <div class="archive-hover-meta" aria-live="polite">
            <p class="archive-hover-category" id="archiveHoverCategory"></p>
            <p class="archive-hover-summary" id="archiveHoverSummary"></p>
          </div>
          <div class="article-list" id="articleList" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <div
      class="article-loading-overlay"
      id="articleLoadingOverlay"
      aria-hidden="true"
    >
      <img
        class="article-loading-logo"
        id="articleLoadingLogo"
        src="data:image/svg+xml,%3Csvg viewBox='0 0 318 303' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M258.737 243.684C248.931 166.791 229.591.501 172.983.5 116.374.499 96.231 141.984 74.659 237.941 53.086 333.898-30.091 308.403 29.281 231.917 88.653 155.432 258.737 160.696 303.844 237.941 348.951 315.186 268.543 320.578 258.737 243.684Z' fill='none' stroke='black' stroke-width='4'/%3E%3Cpath d='M103.805 106.472C181.432-57.303 237.164 110.325 237.164 110.325S218 3 173.746.5C129.558-1.996 108.095 88.404 103.824 106.39Z' fill='black'/%3E%3Cpath d='M260 248.5C273.5 334.5 350.5 309.5 302 236c35.301 58.835-26 68.5-42 12.5Z' fill='black'/%3E%3Cpath d='M68.775 256.196C41.319 332.681-33.477 300.558 37.125 224.073-6.021 275.063 43.28 309.147 68.775 256.196Z' fill='black'/%3E%3C/svg%3E"
        alt=""
      />
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
