<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atmos Reading Articles</title>
  <link rel="stylesheet" href="./articles.css" />
</head>

<body>
  <nav class="article-topbar">
    <a href="./index.html" class="topbar-left">Back</a>

    <div class="topbar-logo" id="archiveLogo">
      <span id="archiveLogoText">Atmos</span>
      <img id="archiveLogoImage" src="" alt="Responsive logo" />
    </div>

    <div class="topbar-right">
      <button id="topSearchButton" type="button">Search</button>
      <input
        id="articleSearch"
        class="topbar-search-input"
        type="text"
        placeholder="Search keywords"
      />
    </div>
  </nav>

  <header class="articles-header">
    <h1>All Articles</h1>
  </header>

  <main class="articles-main">
    <section id="allArticles" class="articles-grid">
      <!-- Firebase articles will appear here -->
    </section>
  </main>

  <script type="module" src="./articles.js"></script>
</body>
</html>
