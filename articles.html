<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atmos Reading Articles</title>
  <link rel="stylesheet" href="./articles.css?v=20260502-5" />
</head>

<body>
  <nav class="article-topbar site-topbar">
    <div class="site-topbar-left">
      <a href="https://atmos.earth/" target="_blank" rel="noopener noreferrer">atmos.earth</a>
    </div>

    <div class="topbar-logo site-topbar-center" id="archiveLogo">
      <span id="archiveLogoText">Atmos</span>
      <img id="archiveLogoImage" src="" alt="Responsive logo" />
    </div>

    <div class="site-topbar-right">
      <a href="./index.html" class="site-home-link">home</a>
      <a href="./articles.html" class="site-archive-link">archive</a>
      <a href="./trace.html" class="site-trace-link">trace</a>
    </div>
  </nav>

  <header class="articles-header">
    <h1>All Articles</h1>
  </header>

  <section class="archive-search-section">
    <div class="archive-search-wrap" id="archiveSearchWrap">
      <div class="archive-search-field">
        <input
          id="articleSearch"
          class="archive-search-input"
          type="text"
          placeholder=""
          autocomplete="off"
        />
        <button id="topSearchButton" class="archive-search-button" type="button" aria-label="Save search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M16.65 16.65L21 21"></path>
          </svg>
        </button>
      </div>
      <div class="archive-search-history" id="searchHistoryPanel" hidden>
        <ul class="archive-search-history-list" id="searchHistoryList"></ul>
      </div>
    </div>
  </section>

  <main class="articles-main">
    <section id="allArticles" class="articles-grid">
      <!-- Firebase articles will appear here -->
    </section>
  </main>

  <script type="module" src="./articles.js?v=20260502-5"></script>
</body>
</html>
